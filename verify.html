<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Verify Asset Passport</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b1728;background:#f3f7fb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef5fb 0%,#f7f9fc 52%,#edf3f8 100%);padding:18px}
.wrap{width:min(620px,100%);margin:clamp(18px,8vh,72px) auto}.brand{display:flex;align-items:center;gap:10px;margin:0 4px 12px;color:#64748b;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.brand-mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#06365a,#0877d1);color:#fff;font-size:16px;box-shadow:0 8px 20px rgba(4,76,135,.2)}
.card{background:rgba(255,255,255,.96);border:1px solid #dbe5ee;border-radius:28px;padding:24px;box-shadow:0 24px 60px rgba(15,38,64,.12)}h1{font-size:30px;line-height:1.08;margin:0 0 8px;letter-spacing:-.03em}.sub{margin:0;color:#66768a;font-size:15px;line-height:1.5}.status{margin-top:22px;border:1px solid #dbe5ee;border-radius:20px;padding:20px;background:#f8fbfe}.status.ok{background:#effaf4;border-color:#b9e4ca}.status.bad{background:#fff5f4;border-color:#f1c7c3}.badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px}.badge.ok{background:#d9f5e4;color:#087443}.badge.bad{background:#fee4e2;color:#b42318}.asset{margin-top:18px}.asset-name{font-size:24px;font-weight:850;letter-spacing:-.02em}.meta{margin-top:5px;color:#66768a}.code{display:inline-block;margin-top:16px;padding:10px 12px;border-radius:12px;background:#edf5fc;color:#0a4f84;font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.field{border:1px solid #dbe5ee;border-radius:15px;padding:12px;background:#fff}.field small{display:block;color:#8190a1;text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:800;margin-bottom:4px}.field b{font-size:14px}.note{margin-top:18px;color:#7a8797;font-size:12px;line-height:1.5}.actions{display:flex;gap:10px;margin-top:20px}.btn{appearance:none;border:1px solid #d3dfeb;background:#fff;color:#0b1728;border-radius:14px;padding:12px 15px;font-weight:800;font-size:14px;text-decoration:none;text-align:center;flex:1}.btn.primary{background:linear-gradient(135deg,#063b63,#0878d8);border-color:transparent;color:#fff}.footer{text-align:center;color:#8a97a6;font-size:11px;margin-top:14px}
@media(max-width:480px){body{padding:12px}.card{padding:18px;border-radius:23px}h1{font-size:27px}.grid{grid-template-columns:1fr}.actions{flex-direction:column}.wrap{margin-top:18px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span class="brand-mark">✓</span> Asset Passport</div>
  <section class="card" aria-live="polite">
    <h1>Public verification</h1>
    <p class="sub">Check whether an Asset Passport is registered and publicly verifiable.</p>
    <div id="out" class="status"><span class="badge">Checking…</span></div>
    <p class="footer">Only public-safe registry information is shown.</p>
  </section>
</main>
<script>window.ASSET_PASSPORT_CONFIG={
  supabaseUrl:"https://eglmyonjvijoghvewxio.supabase.co",
  supabasePublishableKey:"sb_publishable_SYSECoEcSha-p7eg_XYRpw_L1GQokr1",
  verifyFunctionUrl:"https://eglmyonjvijoghvewxio.supabase.co/functions/v1/swift-endpoint",
  publicVerifyBase:""
};</script>
<script>
const C=window.ASSET_PASSPORT_CONFIG||{};
const code=(new URLSearchParams(location.search).get('code')||'').trim().toUpperCase();
const out=document.getElementById('out');
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function renderBad(msg){out.className='status bad';out.innerHTML='<span class="badge bad">✕ Not verified</span><p class="sub" style="margin-top:12px">'+esc(msg)+'</p>'}
(async()=>{
  if(!code){renderBad('No Passport Code was supplied.');return;}
  if(!C.verifyFunctionUrl){renderBad('Verification service is not configured.');return;}
  try{
    const u=new URL(C.verifyFunctionUrl);u.searchParams.set('code',code);
    const r=await fetch(u,{headers:{Accept:'application/json'}});const j=await r.json();
    if(!r.ok||!j.verified){renderBad(j.error||'Passport not found.');return;}
    const a=j.passport||j;
    if(!a||!a.name||!a.passport_code)throw new Error('Invalid verification response');
    out.className='status ok';
    out.innerHTML='<span class="badge ok">✓ VERIFIED</span><div class="asset"><div class="asset-name">'+esc(a.name)+'</div><div class="meta">'+esc(a.asset_type||'Asset')+' · '+esc(a.status||'Registered')+'</div><span class="code">'+esc(a.passport_code)+'</span></div><div class="grid"><div class="field"><small>Category</small><b>'+esc(a.asset_type||'—')+'</b></div><div class="field"><small>Status</small><b>'+esc(a.status||'—')+'</b></div></div><div class="actions"><a class="btn primary" href="'+esc(location.href)+'">Refresh</a></div>';
  }catch(e){renderBad('Verification service is temporarily unavailable. Please try again.');}
})();
</script>
</body></html>
